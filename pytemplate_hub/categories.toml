# The labels the site shows for each category. The list itself is pytemplate-uv's fixed
# PACK_CATEGORIES; a pack declares categories from it in pytemplate-pack.toml. Every category needs
# a label here, and a label for a category pytemplate-uv lacks is refused.

[cli]
label = "Command-line apps"

[library]
label = "Libraries"

[web]
label = "Web services and APIs"

[worker]
label = "Background workers"

[data]
label = "Data pipelines"

[ai]
label = "AI tools and MCP"

[quant]
label = "Quant research"
