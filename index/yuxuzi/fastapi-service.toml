profiles = [{ id = "service", lifecycle = "passed", name = "FastAPI service", description = "A layered FastAPI service with health and readiness, settings, JSON logs, an in-memory example resource, and tests.", kind = "service", supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"], dependencies = [], security_posture = "No secrets are needed to run it, and it contacts no service. No authentication is included: add it before exposing the service beyond a trusted network. The generated checks do not test deployment, the Dockerfile, or authentication; production settings refuse wildcard hosts and debug mode, and nothing else is checked." }, { id = "service-sql", lifecycle = "passed", name = "FastAPI service with SQL", description = "The service profile with the example resource stored through SQLAlchemy 2: SQLite by default, tables created at startup, and tests on a temporary SQLite file.", kind = "service", supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"], dependencies = [], security_posture = "No secrets are needed by default: the database is a SQLite file created in the working directory. A PostgreSQL DATABASE_URL carries a password, so supply it through the environment. No authentication is included: add it before exposing the service beyond a trusted network. The generated checks use SQLite only and do not test PostgreSQL, deployment, the Dockerfile, or authentication; production settings refuse wildcard hosts and debug mode but accept the default SQLite URL." }]
