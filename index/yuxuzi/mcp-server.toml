profiles = [{ id = "tools", lifecycle = "passed", name = "MCP server, stdio", description = "An MCP server over stdio with two example tools and tests that call them through an in-process client session.", kind = "service", supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"], dependencies = ["mcp"], security_posture = "Tools run with the server's own permissions. The example tools read only their input. Nothing is authenticated: the server trusts whichever MCP client launches it over stdio. The project needs no secrets, network, or services, and the checks do not review what your own tools do." }, { id = "tools-http", lifecycle = "passed", name = "MCP server, streamable HTTP", description = "The same MCP server served over streamable HTTP on localhost, with tests that run its HTTP app in process.", kind = "service", supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"], dependencies = ["mcp"], security_posture = "Tools run with the server's own permissions. The example tools read only their input. The HTTP server has no authentication and binds to 127.0.0.1 by default; set MCP_HOST to another address only behind your own authentication and network controls. Anyone who can reach the port can call the tools. The checks do not review what your own tools do." }]
