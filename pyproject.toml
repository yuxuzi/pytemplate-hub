[project]
name = "pytemplate-hub"
version = "0.1.0"
description = "A static, verified index of pytemplate-uv template packs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pytemplate-uv>=3.1,<4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
pytemplate_hub = "pytemplate_hub.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=pytemplate_hub --cov-report=term-missing"

[tool.coverage.run]
branch = true
