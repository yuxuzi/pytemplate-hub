# Checks a proposed index change. This runs untrusted template code, so it must stay isolated:
# - the `pull_request` trigger gives pull requests from forks no secrets;
# - the token can only read, and it is not left on disk for later steps.
# - the tooling (the hub's code, its lock file, and its checks) comes from the base commit, so a
#   pull request cannot change the checker it is judged by. The pull request's index is read as
#   data only (`head/index`). A pull request that changes both the schema and the index must be
#   split in two: the schema change merges first, then the index entries that rely on it.
# Never add secrets, write permissions, or a `pull_request_target` trigger to this workflow.
name: Verify index

on:
  pull_request:
    paths:
      - "index/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the base commit (trusted tooling)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request (index data only)
        uses: actions/checkout@v7
        with:
          path: head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install the base commit's tooling
        working-directory: base
        run: uv sync --locked
      - name: Refuse review claims and rewritten facts
        working-directory: base
        run: |
          # A base with no index yet has nothing to compare against.
          mkdir -p index
          uv run pytemplate_hub check-claims --base index --index ../head/index
      - name: Check every listed version, running its lifecycle commands
        working-directory: base
        run: uv run pytemplate_hub verify --index ../head/index --run-lifecycle
